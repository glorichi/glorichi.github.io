<link rel="stylesheet" href="/pswp/photoswipe.css">
<style>
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 8px;
        margin: 16px 0;
    }
    .gallery[data-cols="2"] {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
    .gallery[data-cols="2"] .gallery-item {
        aspect-ratio: 2 / 3;
    }
    .gallery[data-cols="2"] .gallery-item img {
        height: 100%;
        object-fit: cover;
    }
    .gallery .gallery-item {
        margin: 0 !important;
        overflow: hidden;
        border-radius: 4px;
    }
    .gallery .gallery-item a {
        display: block;
        text-decoration: none;
    }
    .gallery .gallery-item img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        margin: 0 !important;
        transition: opacity 0.2s ease;
    }
    .gallery .gallery-item a:hover img {
        opacity: 0.85;
    }

    .first-entry .entry-cover,
    .post-entry .entry-cover {
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
    }
</style>
